<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection · Core NFT Viewer</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site">
    <a href="/">← Home</a>
  </header>
  <main>
    <div class="collection-head">
      <h1 id="col-title">Collection</h1>
      <div id="col-sub" class="addr"></div>
    </div>
    <p id="col-error" class="msg err" style="display:none"></p>
    <p id="col-loading" class="loading">Loading collection…</p>
    <div id="nft-grid" class="grid"></div>
  </main>
  <footer class="site">
    In-game text in English · Metadata and images load from tokenURI (IPFS or HTTPS)
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="/js/collection-page.js"></script>
</body>
</html>
